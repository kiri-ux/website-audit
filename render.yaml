# Render blueprint — production topology.
#
# The shape that matters: the web service NEVER crawls. It enqueues and returns.
# The worker owns all long-running work. This is not a preference; a Render web
# service cannot hold a request open for the length of a crawl.
#
# Deploy:  push this file, then "New > Blueprint" in the Render dashboard.

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: vici-audit-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn app.api:app --host 0.0.0.0 --port 8000
    plan: starter                  # thin service; it does no real work
    healthCheckPath: /healthz
    envVars:
      - key: APP_MODE
        value: internal            # flip to "partner" when you go partner-facing
      - key: DATABASE_URL
        fromDatabase: {name: vici-audit-db, property: connectionString}
      - key: REDIS_URL
        fromService: {type: keyvalue, name: vici-audit-queue, property: connectionString}
      # Leave UNSET. The default is db://, which is the only store the API and
      # the worker actually share — they are separate containers with separate
      # disks. Set it only for s3:// or r2://. A local:// path here silently
      # breaks crawl reuse and artifact download in both directions.
      - key: ARTIFACT_STORE
        sync: false                # unset = db://   |   s3://your-bucket
      - key: PSI_API_KEY
        sync: false
      # The PDF is rendered by the API, so authorship must be set HERE as well
      # as on the worker — setting it only on the worker produces an unsigned
      # report and no error to explain why.
      - key: ANALYST_NAME
        sync: false
      - key: ANALYST_TITLE
        sync: false
      - key: ANALYST_EMAIL
        sync: false
      - key: FIRM_NAME
        sync: false
      - key: REPORT_LOGO_PATH
        sync: false
      # Google OAuth setup, API-side only. The COLLECTORS run on the worker and
      # need GOOGLE_TOKENS there; these three exist purely so you can mint a
      # token from a browser. See "Minting a GOOGLE_TOKENS entry" in DEPLOY.md.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # ALSO on the API, not only the worker. The homepage access check and the
      # property dropdowns answer synchronously, so they run here.
      #
      # It must be DECLARED in this blueprint even though the value is set by
      # hand: this service is Blueprint-managed, and Render reconciles a
      # managed service's environment against the blueprint. A variable added
      # in the dashboard but missing here can be removed on a later sync — and
      # the symptom would be the access check quietly reporting "not set on
      # this service" weeks later, with nothing in the deploy log to blame.
      - key: GOOGLE_TOKENS
        sync: false
      # Set to any random string to OPEN the setup routes, then REMOVE it. With
      # it unset, /oauth/google/start and /oauth/google/callback return 404 and
      # the surface does not exist. A token minted there inherits every client
      # property the login can see, so it does not stay open between uses.
      - key: OAUTH_SETUP_TOKEN
        sync: false

  # ---------------------------------------------------------------- worker
  - type: worker
    name: vici-audit-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python3 -m app.worker
    # Size for Chromium: ~1GB per concurrent browser, plus the crawl artifact
    # held in memory. Do not run this on the smallest instance with RENDER_JS on.
    plan: standard
    envVars:
      - key: APP_MODE
        value: internal
      - key: DATABASE_URL
        fromDatabase: {name: vici-audit-db, property: connectionString}
      - key: REDIS_URL
        fromService: {type: keyvalue, name: vici-audit-queue, property: connectionString}
      # Leave UNSET — see the note on the API service above.
      - key: ARTIFACT_STORE
        sync: false                # unset = db://   |   s3://your-bucket
      - key: PSI_API_KEY
        sync: false
      - key: CRAWL_USER_AGENT
        value: "ViciAuditBot/1.0 (+https://vicimediainc.com/bot; SEO audit crawler)"
      # AI visibility monitor. Any platform without a key is reported as
      # "not measured" rather than counted as zero visibility.
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PERPLEXITY_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # AI Overviews needs a SERP provider (SerpAPI-shaped: ?q=&api_key=&engine=).
      # Without it GEO-23 reports "not measured" rather than zero visibility.
      - key: SERP_API_KEY
        sync: false
      - key: SERP_ENDPOINT
        sync: false
      # Microsoft Copilot has no public consumer API. Route it through Azure
      # OpenAI with Bing grounding if you want GEO-26; leave unset and that row
      # says the platform was not measured, which is the truth.
      - key: COPILOT_ENDPOINT
        sync: false
      - key: COPILOT_API_KEY
        sync: false
      # Phase 3 judgment layer (E-E-A-T + GEO assessment). Absent = those 29
      # rows report Need Access rather than being guessed at.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Off-page authority, keyword rankings, Lighthouse and screenshots.
      # These are the credentials the SEO quote tool already runs on — set them
      # and DataForSEO answers all four; leave them and the Ahrefs/Semrush
      # adapter below is used for backlinks only.
      - key: DFS_LOGIN
        sync: false
      - key: DFS_PASSWORD
        sync: false
      - key: AHREFS_API_KEY
        sync: false
      - key: SEMRUSH_API_KEY
        sync: false
      # Client analytics OAuth (Search Console + GA4, 38 rows).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # JSON {"label": "refresh_token"} of VICI logins — the same model the
      # site-scan tool uses for GTM. A token inherits whatever that login can
      # already see, including properties added tomorrow, with no per-client
      # OAuth dance. It does NOT replace the access grant itself.
      - key: GOOGLE_TOKENS
        sync: false
      # Optional logo for the client PDF; blank = unbranded with a clean slot.
      - key: REPORT_LOGO_PATH
        sync: false
      # Evidence screenshots. Adds up to ~30s per audit (3 shots, 10s cap each)
      # and needs the Playwright browser, which the worker image already has.
      # Set to "true" to turn them off.
      - key: SKIP_SCREENSHOTS
        sync: false
      # Report authorship. A named analyst on the cover and a sign-off block at
      # the end is the cheapest thing that makes a deliverable read as work
      # someone did rather than output something produced. Blank = omitted
      # entirely rather than printed as a placeholder.
      - key: ANALYST_NAME
        sync: false
      - key: ANALYST_TITLE
        sync: false
      - key: ANALYST_EMAIL
        sync: false
      - key: FIRM_NAME
        sync: false
      # Scale out by raising numInstances — the Redis queue makes workers
      # independent, and job handling is idempotent.
    numInstances: 1

  # ---------------------------------------------------------------- cron
  # Enqueues due monitor runs. Finishes in seconds — it does NOT execute runs,
  # because Render hard-stops a cron at 12 hours and a fleet of monitor runs
  # across many clients would blow past that. The worker does the work.
  - type: cron
    name: vici-monitor-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python3 -m app.schedule --due-only
    schedule: "0 6 1 * *"          # 06:00 UTC on the 1st of each month
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: vici-audit-db, property: connectionString}
      - key: REDIS_URL
        fromService: {type: keyvalue, name: vici-audit-queue, property: connectionString}
      - key: MONITOR_INTERVAL_DAYS
        value: "30"
      - key: MONITOR_REPEATS
        value: "3"

  # ---------------------------------------------------------------- queue
  - type: keyvalue
    name: vici-audit-queue
    plan: starter
    ipAllowList: []                # internal-only access

databases:
  - name: vici-audit-db
    plan: basic-256mb
    postgresMajorVersion: "16"
